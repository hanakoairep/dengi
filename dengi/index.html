<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" id="tc1">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" id="tc2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Деньги</title>
<style>
/* VOICE: тихий, аккуратный, без лишнего — как хороший калькулятор
   IDEA: калькулятор-чек: сумма крупно, под ней клавиши, категории как кнопки «готово»
   PICTURE: экран ввода — крупная сумма, сетка категорий, мягкая клавиатура
   COLOUR and TYPE: тёплый светлый фон и белые клавиши / почти чёрный фон и графитовые клавиши; цвет только у категорий; Onest
   LAYOUT: одна колонка до 520px, экран ввода без прокрутки, нижние вкладки, шторки снизу */
:root{color-scheme:light dark;--bg:light-dark(#f4f4f1,#0d0d0f);--surf:light-dark(#fff,#17171a);--key:light-dark(#fff,#1d1d21);--keyp:light-dark(#ebebe7,#2a2a2f);--ink:light-dark(#17171a,#f1f1f2);--mute:light-dark(#8c8c92,#85858d);--line:light-dark(#e6e6e2,#25252a);--inc:light-dark(#178a5c,#43cc8d);--neg:light-dark(#d9473f,#ff6b63)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--mute)}
.ib svg{width:22px;height:22px}
.sum{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:2px;flex-wrap:wrap}
.sum b{font-weight:600;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--keyp);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border-radius:9px;font-weight:500;font-size:15px;color:var(--mute);padding:0 12px}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.ctl{display:flex;gap:8px;margin-top:12px}.ctl .seg:first-child{flex:1}
.amt{padding:14px 2px 6px}
.amt .v{font-size:48px;font-weight:600;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow-x:auto;scrollbar-width:none;direction:ltr}
.amt .v::-webkit-scrollbar{display:none}
.amt .v.z{color:var(--mute)}
.amt .r{font-size:15px;color:var(--mute);min-height:22px}
.meta{display:flex;gap:8px;margin:4px 0 10px}
.inp{width:100%;min-height:44px;border:0;background:var(--surf);border-radius:12px;padding:0 14px;font-size:16px;appearance:none;outline:none}
.inp:focus{box-shadow:0 0 0 2px var(--ink)}
textarea.inp{padding:12px 14px;min-height:120px;font-size:13px}
.dchip{position:relative;flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surf);display:flex;align-items:center;font-size:15px;white-space:nowrap}
.dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cat{min-height:50px;border-radius:12px;background:var(--surf);padding:6px 10px;display:flex;align-items:center;gap:8px;text-align:left;font-size:14px;line-height:1.2;transition:transform .12s}
.cat i{flex:none;width:9px;height:9px;border-radius:50%}
.cat:active{transform:scale(.97)}
.cat.on{box-shadow:inset 0 0 0 2px var(--ink);font-weight:600}
.cat.add{color:var(--mute);justify-content:center}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.kp button{height:52px;border-radius:12px;background:var(--key);font-size:22px;font-weight:500;display:grid;place-items:center}
.kp button.op{background:var(--keyp);font-size:20px}
.kp button:active{background:var(--keyp)}
.kp svg{width:24px;height:24px}
.h2{font-size:13px;color:var(--mute);margin:24px 0 8px;display:flex;justify-content:space-between}
.card{background:var(--surf);border-radius:16px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.card>.row:last-child,.card>:last-child .row:last-child{border-bottom:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.rm{flex:1}.rm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm small,.rr small{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right;white-space:nowrap;font-weight:600}
.inc{color:var(--inc)}.neg{color:var(--neg)}
.big3{display:grid;gap:0}
.big3 .row b{font-weight:400}
.big3 .rr{font-size:20px}
.bar{padding:12px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .l{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar .l span:last-child{font-weight:600;white-space:nowrap}
.meter{height:6px;background:var(--keyp);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:3px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.mnav b{font-size:17px;font-weight:600}
.mnav .ib{background:var(--surf);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tile{background:var(--surf);border-radius:16px;padding:14px 16px}
.tile small{display:block;font-size:13px;color:var(--mute)}
.tile b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:14px;font-weight:600;font-size:16px;margin-top:10px;background:var(--surf)}
.btn.pr{background:var(--ink);color:var(--bg)}
.btn.dg{color:var(--neg)}
.fl{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.empty{padding:36px 8px;text-align:center;color:var(--mute);font-size:15px}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:20px 4px 6px}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pal button{width:40px;height:40px;border-radius:50%}
.pal button.on{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--ink)}
.sw{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgb(0 0 0/.35);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:94dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet h3{font-size:20px;font-weight:700;margin:4px 0 12px;letter-spacing:-.01em}
.sw.on .scrim{opacity:1}.sw.on .sheet{transform:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 8px env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;font-size:13px;color:var(--mute)}
nav svg{width:22px;height:22px}
nav button.on{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:center;font-size:15px;z-index:60;transition:.2s;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);opacity:.7;font-weight:600;min-height:32px;padding:0 6px}
.small{font-size:13px;color:var(--mute)}
.mt{margin-top:12px}
.cats.edit .cat{box-shadow:inset 0 0 0 1.5px var(--mute);background:transparent}
.cats.edit .cat.done{box-shadow:none;background:var(--ink);color:var(--bg);font-weight:600}
.cat.tool{color:var(--mute);justify-content:center}
.ctl2{display:flex;gap:8px;margin-top:8px}.ctl2 .seg:first-child{flex:1}
.tot{font-size:clamp(34px,11vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:14px 0 2px;white-space:nowrap}
.sub{font-size:15px;color:var(--mute)}
.tile .pc{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:2px}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:14px 0 4px;background:var(--keyp)}
.splitbar i{display:block;height:100%}
.tag{display:inline-block;font-size:12px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--keyp);color:var(--mute);margin-right:6px;vertical-align:1px}
.accs{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px;padding:1px 0}
.accs::-webkit-scrollbar{display:none}
.accs>span{flex:none;font-size:13px;color:var(--mute);margin-right:2px}
.acc{flex:none;min-height:36px;padding:0 14px;border-radius:18px;background:var(--surf);font-size:14px;white-space:nowrap}
.acc.on{background:var(--ink);color:var(--bg);font-weight:600}
.rep{font-size:12px;color:var(--mute);margin-left:4px}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.cat{transition:none}}
@media (max-height:700px){.kp button{height:46px}.amt .v{font-size:40px}.cat{min-height:44px}}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>
<nav class="tabs" aria-label="Разделы"><div class="in">
  <button data-act="go" data-id="bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Банк</button>
  <button data-act="go" data-id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 13h0M12 13h0M16 13h0M8 17h0M12 17h0M16 17h0"/></svg>Запись</button>
  <button data-act="go" data-id="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>История</button>
  <button data-act="go" data-id="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>Итоги</button>
</div></nav>
<div class="sw" id="sw" hidden><div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sb"></div></div></div>
<div class="toast" id="toast" role="status"><span></span><button hidden></button></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const PAL=['#f0705f','#f3a43b','#e3c548','#5cc28a','#4db6c4','#5b8def','#9a7cf0','#e27cbf','#b58a66','#9aa0a6'];
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9l-6 6M11 9l6 6"/></svg>';

const blankMeta=()=>({v:3,cats:[],assets:[],recs:[],rate:80.5,rateAt:null,base:'RUB',debts:[]});
function normMeta(m){
  m=m||{};
  const out=Object.assign(blankMeta(),m);
  if(!(+out.rate>0))out.rate=m.rates&&m.rates.RUB?+(1/m.rates.RUB).toFixed(2):80.5;
  if(!['RUB','USD'].includes(out.base))out.base='RUB';
  for(const k of ['cats','debts','assets','recs'])if(!Array.isArray(out[k]))out[k]=[];
  out._wal=Array.isArray(m.wallets)?m.wallets.map(w=>({id:w.id,cur:w.cur})):(m._wal||[]);
  delete out.wallets;delete out.rates;delete out.goals;delete out.lastW;delete out.hide;
  return out;
}
function normTx(L,meta){
  return (L||[]).filter(t=>t&&t.t!=='tr').map(t=>{
    t={...t};
    if(!t.cur){const w=(meta._wal||[]).find(x=>x.id===t.w);t.cur=w&&w.cur==='RUB'?'RUB':'USD';if(t.oc==='RUB'){t.cur='RUB';t.a=t.oa}t.rr=t.rr?+(1/t.rr).toFixed(4):meta.rate;delete t.w;delete t.u;delete t.oa;delete t.oc}
    if(t.k!=='c'&&t.k!=='r')t.k=t.cur==='USD'?'c':'r';
    return t;
  });
}
function upgrade(){
  if((S.meta.v||0)>=3)return false;
  const used=new Set(Object.values(S.months).flat().map(t=>t.c));
  S.meta.cats=S.meta.cats.filter(c=>!/^[ei]\d+$/.test(c.id)||used.has(c.id));
  S.meta.v=3;return true;
}

let S={meta:blankMeta(),months:{}},hasData=false,col=null,loadTimer=0,migrating=false,syncMode='init';
const ui={view:'bank',sym:'',st:'exp',limit:120,k:'all',edit:false};
const writing={},dirty={};
function cacheLoad(){try{const j=JSON.parse(localStorage.getItem('fin.v2')||localStorage.getItem('fin.v1')||'null');if(j&&j.meta){const meta=normMeta(j.meta);const months={};for(const k in j.months||{})months[k]=normTx(j.months[k],meta);S={meta,months};hasData=true;upgrade()}}catch(e){}}
function cacheSave(){try{localStorage.setItem('fin.v2',JSON.stringify(S))}catch(e){}}
async function put(key){
  cacheSave();hasData=true;
  return;
  if(!col)return;
  if(writing[key]){dirty[key]=true;return}
  writing[key]=true;
  try{do{dirty[key]=false;const body=key==='meta'?S.meta:{tx:S.months[key.slice(2)]||[]};await col.doc(key).set(JSON.parse(JSON.stringify(body)))}while(dirty[key])}
  catch(e){toast('Не удалось сохранить в облако, запись осталась на устройстве');syncMode='local'}
  finally{writing[key]=false}
}
function onSnap(snap){
  if(migrating)return;
  if(snap.metadata.fromCache&&snap.empty)return;
  clearTimeout(loadTimer);
  if(!snap.metadata.fromCache)syncMode='cloud';
  if(snap.empty){
    if(hasData&&!snap.metadata.fromCache){migrating=true;Promise.all(['meta',...Object.keys(S.months).map(k=>'m-'+k)].map(put)).finally(()=>{migrating=false})}
    return render();
  }
  let meta=null;const raw={};
  for(const d of snap.docs){const v=d.data();if(!v)continue;if(d.id==='meta')meta=v;else if(d.id.startsWith('m-'))raw[d.id.slice(2)]=v.tx}
  if(meta)S.meta=normMeta(JSON.parse(JSON.stringify(meta)));
  const m={};for(const k in raw)m[k]=normTx(raw[k],S.meta);
  S.months=m;hasData=true;if(upgrade())put('meta');cacheSave();
  if(ui.view==='add'){drawSum();const mc=$('#mcats');if(mc&&$('#sw').hidden)mc.innerHTML=catBtns(M.t,null,'savecat',true)}else render();
}
async function fetchRate(force){
  if(!navigator.onLine)return;
  const last=+LSget('fin.autoAt','0');if(!force&&Date.now()-last<3*3600e3&&+AUTO.usd>0)return;
  const get=async(url,pick)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)return null;return pick(await r.json())}catch(e){return null}finally{clearTimeout(t)}};
  let v=await get('https://www.cbr-xml-daily.ru/daily_json.js',j=>j&&j.Valute&&j.Valute.USD?{usd:+j.Valute.USD.Value,date:String(j.Date).slice(0,10),src:'ЦБ'}:null);
  if(!v)v=await get('https://open.er-api.com/v6/latest/USD',j=>j&&j.rates&&j.rates.RUB?{usd:+j.rates.RUB,date:new Date((j.time_last_update_unix||0)*1000).toISOString().slice(0,10),src:'рынок'}:null);
  if(!v||!(v.usd>30&&v.usd<300))return;
  LSset('fin.autoAt',String(Date.now()));
  if(v.usd===+AUTO.usd&&v.date===AUTO.date)return;
  AUTO=v;LSset('fin.auto',JSON.stringify(AUTO));
  if(ui.view==='add'){drawSum();drawAmt('main')}else if($('#sw').hidden)render();
}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const ymNow=()=>today().slice(0,7);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const shiftYm=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};
function dayLabel(d){const t=today();if(d===t)return 'Сегодня';const y=new Date();y.setDate(y.getDate()-1);if(d===iso(y))return 'Вчера';const dt=new Date(d+'T12:00');return dt.getDate()+' '+MG[dt.getMonth()]+(d.slice(0,4)!==t.slice(0,4)?' '+d.slice(0,4):'')}
const shortDay=d=>d===today()?'Сегодня':dayLabel(d).replace(/ \d{4}$/,'');
let AUTO=(()=>{try{return JSON.parse(localStorage.getItem('fin.auto')||'{}')||{}}catch(e){return {}}})();

function conv(a,from,to,rr){if(from===to)return a;rr=rr||R();return from==='USD'?a*rr:a/rr}
const toBase=(a,c,rr)=>conv(a,c,base(),rr);
const txBase=t=>toBase(t.a,t.cur,t.rr);
const NFc={};const NF=d=>NFc[d]||(NFc[d]=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}));
function money(v,c,o={}){v=+v||0;const sg=o.sign?(v<0?'−':'+'):(v<0?'−':'');const s=NF(Math.abs(v)>=1000?0:2).format(Math.abs(v));return c==='USD'?sg+'$'+s:sg+s+' ₽'}

const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};

function nalik(create){let a=S.meta.assets.find(x=>x.k==='r'&&/^нал/i.test(x.name));if(!a&&create){a={id:uid(),k:'r',name:'Налик',a:0,cur:'RUB',upd:today()};S.meta.assets.push(a)}return a}
function accList(k){if(k==='r'){const n=nalik(false);return [n||{id:'__nal',name:'Налик',cur:'RUB',k:'r'}]}return S.meta.assets.filter(a=>a.k==='c')}
function defAcc(k){if(k==='r')return (nalik(false)||{id:'__nal'}).id;const L=accList('c'),id=LSget('fin.acc.c','');return (L.find(a=>a.id===id)||L[0]||{}).id||null}
function resolveAcc(id,k){if(k==='r')return nalik(true);return S.meta.assets.find(a=>a.id===id&&a.k==='c')||null}

function accChips(k,sel,act,t){const L=accList(k);return `<div class="accs"><span>${t==='inc'?'Куда':'Откуда'}</span>${L.length?L.map(a=>`<button class="acc ${sel===a.id||(k==='r')?'on':''}" data-act="${act}" data-id="${a.id}">${esc(a.name)}</button>`).join(''):`<button class="acc" data-act="go" data-id="bank">Добавь счета в Банке</button>`}</div>`}
function applyAcc(t,sign){if(!t||!t.acc)return false;const a=S.meta.assets.find(x=>x.id===t.acc);if(!a)return false;a.a=r2(a.a+(t.t==='exp'?-1:1)*(t.aa??t.a)*sign);a.upd=today();return true}
function runRecurring(){
  const t=today(),ym=ymNow(),keys=new Set();let n=0;
  for(const r of S.meta.recs||[]){let g=0;while(r.next<=ym&&g++<24){const d=r.next+'-'+pad(Math.min(r.day,daysIn(r.next)));if(d>t)break;
    const rec={id:uid(),t:r.t,k:r.k,a:r.a,cur:r.cur,c:r.c,d,n:r.n||'',ts:Date.now(),rr:R(),rec:r.id};
    const a=S.meta.assets.find(x=>x.id===r.acc);if(a){rec.acc=a.id;rec.aa=r2(conv(r.a,r.cur,a.cur,R()))}
    (S.months[d.slice(0,7)]=S.months[d.slice(0,7)]||[]).push(rec);keys.add(d.slice(0,7));applyAcc(rec,1);r.next=shiftYm(r.next,1);n++}}
  if(n){put('meta');keys.forEach(k=>put('m-'+k));toast(`Добавлено регулярных записей: ${n}`)}
  return n;
}
const pl=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c};
function monthTotals(ym,k){const r={inc:0,exp:0,ex:{},in:{}};for(const t of S.months[ym]||[]){if(k&&k!=='all'&&t.k!==k)continue;const v=txBase(t);if(t.t==='exp'){r.exp+=v;r.ex[t.c]=(r.ex[t.c]||0)+v}else{r.inc+=v;r.in[t.c]=(r.in[t.c]||0)+v}}return r}
function calc(s){
  s=String(s).replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/[×xх]/g,'*').replace(/[÷:]/g,'/');
  if(!s)return NaN;s=s.replace(/[+\-*/]+$/,'');
  if(!s||!/^[\d.+\-*/]+$/.test(s))return NaN;
  const terms=s.match(/[+\-]?[^+\-]+/g);if(!terms||terms.join('')!==s)return NaN;
  let tot=0;
  for(let x of terms){let sg=1;if(x[0]==='+'||x[0]==='-'){sg=x[0]==='-'?-1:1;x=x.slice(1)}const f=x.split(/([*/])/);let v=parseFloat(f[0]);if(isNaN(v))return NaN;for(let i=1;i<f.length;i+=2){const n=parseFloat(f[i+1]);if(isNaN(n))return NaN;v=f[i]==='*'?v*n:v/n}tot+=sg*v}
  return isFinite(tot)?Math.round(tot*100)/100:NaN;
}

/* ---------- keypad ---------- */
const EX={},KC={};
function press(s,k){
  s=s||'';const seg=s.split(/[+−]/).pop();
  if(k==='b')return s.slice(0,-1);
  if(k==='c')return '';
  if(k==='+'||k==='−'){if(!s)return s;if(/[+−,]$/.test(s))s=s.slice(0,-1);return s+k}
  if(k===','){if(seg.includes(','))return s;return s+(seg===''?'0,':',')}
  if(s.length>28)return s;
  if(k==='000'){if(seg===''||seg==='0'||seg.includes(','))return s;return s+'000'}
  if(seg.includes(',')&&seg.split(',')[1].length>=2)return s;
  if(seg==='0')return s.slice(0,-1)+k;
  return s+k;
}
function fmtExpr(s){return s.split(/([+−])/).map(p=>{if(p==='+'||p==='−')return ' '+p+' ';const[i,d]=p.split(',');return (i?NF(0).format(+i):'')+(d!==undefined?','+d:'')}).join('')}
function kpHTML(id){
  const keys=[['1'],['2'],['3'],['b',BACK,'op'],['4'],['5'],['6'],['+','+','op'],['7'],['8'],['9'],['−','−','op'],['000'],['0'],[','],['c','C','op']];
  return `<div class="kp" data-kp="${id}">${keys.map(([k,l,c])=>`<button class="${c||''}" data-act="k" data-k="${k}" aria-label="${k==='b'?'Стереть':k==='c'?'Очистить':k}">${l||k}</button>`).join('')}</div>`;
}
function amtHTML(id){return `<div class="amt"><div class="v" id="v-${id}"></div><div class="r" id="r-${id}"></div></div>`}
function drawAmt(id){
  const v=$('#v-'+id),r=$('#r-'+id);if(!v)return;
  const s=EX[id]||'',c=KC[id],sym=c==='USD'?'$':'₽';
  v.textContent=s?(c==='USD'?'$'+fmtExpr(s):fmtExpr(s)+' ₽'):(c==='USD'?'$0':'0 ₽');
  v.classList.toggle('z',!s);v.scrollLeft=v.scrollWidth;
  const n=calc(s);
  const parts=[];
  if(isFinite(n)&&/[+−]./.test(s))parts.push('= '+money(n,c));
  if(isFinite(n)&&n)parts.push('≈ '+money(conv(n,c,other(c)),other(c)));
  r.textContent=parts.join('   ');
}

function upsertTx(rec,old){

  const k=rec.d.slice(0,7);(S.months[k]=S.months[k]||[]).push(rec);keys.add(k);
  keys.forEach(k=>put('m-'+k));
  let ch=false;if(old)ch=applyAcc(old,-1)||ch;ch=applyAcc(rec,1)||ch;if(ch)put('meta');
}

  dd:(el,id)=>{D.dir=id;dDraw()},dc:(el,id)=>{KC.debt=id;dDraw()},dsave:dSave,
  dclose:()=>{const d=S.meta.debts.find(x=>x.id===D.id);S.meta.debts=S.meta.debts.filter(x=>x.id!==D.id);put('meta');render();debtsSheet();toast('Долг закрыт',{label:'Вернуть',fn:()=>{S.meta.debts.unshift(d);put('meta');render()}})},
  ncat:(el,id)=>{let back=null;if($('#fCats')){back='edit';F.n=$('#fN').value;if($('#fD'))F.d=$('#fD').value||F.d;if($('#fDay'))F.day=+$('#fDay').value||F.day}else if(el.closest('#sb'))back='settings';catSheet(null,id,back)},
  ecat:(el,id)=>catSheet(S.meta.cats.find(c=>c.id===id),null,el.closest('#sb')?'settings':null),
  et:(el,id)=>{E.type=id;document.querySelectorAll('#eT button').forEach(b=>b.classList.toggle('on',b.dataset.id===id))},
  ep:(el,id)=>{E.color=id;document.querySelectorAll('#eP button').forEach(b=>b.classList.toggle('on',b.dataset.id===id))},
  csave:cSave,
  cup:()=>{const C=S.meta.cats,i=C.findIndex(c=>c.id===E.id);let j=i-1;while(j>=0&&C[j].type!==C[i].type)j--;if(j>=0){const [x]=C.splice(i,1);C.splice(j,0,x);put('meta')}afterCat()},
  cdel:()=>{const id=E.id,n=allTx().filter(t=>t.c===id).length;const back=E.back;ask('Удалить категорию?',n?`${n} ${pl(n,'запись станет','записи станут','записей станут')} «Без категории» — суммы в итогах останутся.`:'Записей в ней нет.','Удалить',()=>{S.meta.cats=S.meta.cats.filter(c=>c.id!==id);put('meta');render();if(back==='settings')settingsSheet()})},
  mode:(el,id)=>{try{localStorage.setItem('fin.mode',id)}catch(e){}applyMode();settingsSheet()},
  base:(el,id)=>{const inS=!!el.closest('#sb');S.meta.base=id;put('meta');render();if(inS)settingsSheet()},
  rmode:(el,id)=>{S.meta.rateManual=id==='man';if(S.meta.rateManual&&+AUTO.usd>0&&!S.meta.rateAt)S.meta.rate=+AUTO.usd;put('meta');render();settingsSheet()},
  srate:()=>{const v=calc($('#sR').value);if(!(v>0))return toast('Проверь курс');S.meta.rate=v;S.meta.rateAt=today();put('meta');render();toast('Курс сохранён')},
  exp:()=>copyText(JSON.stringify(S),'Копия в буфере — сохрани её в Заметки'),
  dl:()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dengi-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)},
  imp:()=>openSheet(`<h3>Восстановить</h3><p class="small">Выбери файл копии или вставь её текст. Текущие данные заменятся.</p><label class="btn" style="cursor:pointer">Выбрать файл<input type="file" id="impF" accept=".json,application/json,text/plain" hidden></label><textarea class="inp mt" id="impT" placeholder="или вставь текст сюда"></textarea><button class="btn pr" data-act="impgo">Восстановить</button><button class="btn" data-act="close">Отмена</button>`,()=>{$('#impF').onchange=async e=>{const f=e.target.files[0];if(f)$('#impT').value=await f.text()}}),
  impgo:()=>{let j;try{j=JSON.parse($('#impT').value)}catch(e){return toast('Это не резервная копия')}if(!j||!j.meta)return toast('В копии нет данных');closeSheet();replaceAll(j);toast('Восстановлено')},
  wipe:()=>ask('Удалить всё?','Записи, категории и долги сотрутся на всех устройствах.','Удалить всё',()=>{replaceAll({meta:blankMeta(),months:{}});toast('Данные удалены')})
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,el.dataset.id,e)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sw').hidden)return closeSheet();
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||e.metaKey||e.ctrlKey)return;
  const id=!$('#sw').hidden?($('#sb [data-kp]')?.dataset.kp):ui.view==='add'?'main':null;if(!id)return;
  const map={'Backspace':'b','Delete':'c','+':'+','-':'−',',':',','.':','};
  const k=/^\d$/.test(e.key)?e.key:map[e.key];if(!k)return;
  e.preventDefault();EX[id]=press(EX[id],k);drawAmt(id);
});

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sw').hidden&&ui.view!=='add')render();else if(!document.hidden&&ui.view==='add'){drawSum();const l=$('#mdl');if(l)l.textContent=shortDay(M.d||today())}});
applyMode();cacheLoad();runRecurring();ui.view=['bank','add','hist','stats'].includes(LSget('fin.view','bank'))?LSget('fin.view','bank'):'bank';render();
fetchRate();window.addEventListener('online',()=>fetchRate(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchRate();if(runRecurring())render()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
